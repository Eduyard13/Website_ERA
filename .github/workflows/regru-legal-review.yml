name: ERA 0.48.1 release review

on:
  push:
    branches: [regru/legal-0481]

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'Eduyard13/Website_ERA'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_TARGET: regru
      PREVIEW_MODE: '0'
      SITE_URL: https://era-cycle.ru
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, fileinfo, openssl, simplexml, zip
          coverage: none
      - name: Test the site, approved documents, and request handler
        run: |
          command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
          npm ci --omit=optional
          npm test
          python test/deployment/regru-legal-content.py
          python scripts/deploy/package-regru.py --vendor-only
          php test/deployment/regru-cbr.php
          python test/deployment/regru-server.py
          python -m unittest discover -s test/deployment -p 'test_*.py'
      - name: Build and verify the two manual installation archives
        run: |
          output="$RUNNER_TEMP/era-0481"
          python scripts/deploy/regru_legal_0481.py --output "$output" --commit "$GITHUB_SHA"
          cp docs/deployment/ERA_0481_TEST_REPORT.md "$output/"
          (
            cd "$output"
            sha256sum ERA_0481_TEST_REPORT.md >> SHA256SUMS
            sha256sum -c SHA256SUMS
            unzip -q ERA_PROTECTED_0.48.1.zip -d "$RUNNER_TEMP/era-0481-protected"
          )
          bundle="$RUNNER_TEMP/era-0481-protected"
          php "$output/regru_verify_0481_protected.php" "$bundle/MANIFEST.json" "$bundle/public" "$bundle/private"
          cat "$output/PATCH_MANIFEST.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ERA_0.48.1_REVIEW
          path: ${{ runner.temp }}/era-0481
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
