name: Test and deploy ERA preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_MODE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local viewer and archive dependencies
        run: npm ci --omit=optional
      - name: Test root deployment
        run: npm test
      - name: Test project deployment
        run: npm test
        env:
          BASE_PATH: /Website_ERA
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build preview
        run: npm run build
        env:
          BASE_PATH: /Website_ERA
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, re, time, json, hashlib, urllib.request
          from urllib.parse import urljoin

          base = os.environ['ERA_SITE_URL'].rstrip('/') + '/'

          def fetch(path, binary=False):
              url = urljoin(base, path)
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  data = response.read(32_000_000 if binary else 4_000_000)
                  return response.headers.get_content_type(), data if binary else data.decode('utf-8')

          for attempt in range(6):
              try:
                  markers = {'': 'data-resource-home', 'media/': 'data-gallery-showroom', 'about-us/': 'class="about-us-page"', 'contacts/': 'class="contact-premium-page"'}
                  for path, marker in markers.items():
                      content_type, page = fetch(path)
                      if content_type != 'text/html' or '<html lang="ru">' not in page:
                          raise RuntimeError(f'{urljoin(base, path)}: expected the ERA page')
                      if marker not in page or 'id="quick-contact"' not in page or 'data-menu-layout="3-plus-2"' not in page:
                          raise RuntimeError(f'{urljoin(base, path)}: the published update is missing')
                      primary = re.search(r'<nav class="primary-nav"[^>]*>(.*?)</nav>', page, re.S)
                      labels = re.findall(r'<span>(.*?)</span>', primary.group(1)) if primary else []
                      if labels != ['О проекте', 'Технология', 'Оборудование', 'Экономика', 'КАИР']:
                          raise RuntimeError(f'{urljoin(base, path)}: the new header order is missing')
                      footer = re.search(r'<footer\b[^>]*>(.*?)</footer>', page, re.S)
                      if not footer or 'Мы на связи' not in footer.group(1) or footer.group(1).count('class="footer-channel footer-') != 5:
                          raise RuntimeError(f'{urljoin(base, path)}: the five footer channels are missing')
                      if '/preview-only.js?' in page:
                          raise RuntimeError(f'{urljoin(base, path)}: preview mode must not be published')
                      if path == 'media/':
                          if 'data-gallery-showroom' not in page or 'id="gallery-data"' not in page:
                              raise RuntimeError('The gallery update is missing')
                          release = re.search(r'gallery-showroom\.js\?v=([^"&]+)', page)
                          if not release:
                              raise RuntimeError('The gallery script is missing')
                          version = release.group(1)
                  _, library = fetch('documents/')
                  if '<h1>Инженерная библиотека ЭРА.</h1>' not in library or 'data-document-library' not in library:
                      raise RuntimeError('The engineering library is missing')
                  release = re.search(r'document-library\.js\?v=([^"&]+)', library)
                  if not release or release.group(1) != version:
                      raise RuntimeError('Library and gallery releases do not match')
                  data = json.loads(re.search(r'<script type="application/json" id="document-library-data">(.*?)</script>', library, re.S).group(1))
                  documents = [d for d in data['documents'] if d['access'] == 'public' and d['status'] == 'published']
                  if len(documents) < 27 or len({d['file'] for d in documents}) != len(documents):
                      raise RuntimeError('The public PDF index is incomplete or duplicated')
                  by_id = {d['id']: d for d in documents}
                  if by_id['separatsiya-02-technical']['objectSlug'] != 'separatsiya-02' or by_id['separatsiya-01-mini-technical']['objectSlug'] != 'separatsiya-01':
                      raise RuntimeError('Line PDF ownership is incorrect')
                  for category in data['categories']:
                      _, category_page = fetch('documents/' + category['id'] + '/')
                      if '<h1>' + category['title'] + '</h1>' not in category_page or 'data-route-category="' + category['id'] + '"' not in category_page:
                          raise RuntimeError('Category route is missing: ' + category['id'])
                      if 'data-library-layout="compact"' not in category_page or 'data-context-navigation' not in category_page or 'class="dl-category-grid"' in category_page:
                          raise RuntimeError('Compact category navigation is missing: ' + category['id'])
                  if 'class="dl-hero"' not in library or 'class="dl-category-grid"' not in library or 'data-document-card-style="technical-archive"' not in library:
                      raise RuntimeError('Landing library or Technical Archive cards are missing')
                  for nested in ('catalog/equipment/ballisticheskiy-separator/', 'catalog/lines/separatsiya-01/', 'catalog/lines/separatsiya-02/'):
                      _, nested_page = fetch(nested)
                      if nested_page.count('data-context-navigation ') != 1 or 'class="breadcrumbs"' in nested_page:
                          raise RuntimeError('Context navigation is missing or duplicated: ' + nested)
                  print('::notice title=Technical Archive verified::Five compact categories, preserved landing library, steel PDF cards and shared safe back navigation are published.')
                  _, full_line = fetch('catalog/lines/separatsiya-02/')
                  section_ids = ('purpose', 'raw-materials', 'specs', 'process', 'composition', 'quality', 'placement', 'kair', 'photos', 'documents', 'equipment')
                  indices = [full_line.index('id="' + section_id + '"') for section_id in section_ids]
                  if indices != sorted(indices) or full_line.count('data-diagram-mode="fit"') != 1 or 'data-line-source-diagram' in full_line or 'id="line02-workshop"' in full_line:
                      raise RuntimeError('Separation 02 section order or single fit monitor is missing')
                  if f'/line-monitor.js?v={version}' not in full_line or f'/line-documents.js?v={version}' not in full_line:
                      raise RuntimeError('Separation 02 viewer assets are stale')
                  if 'data-hero-finish="titanium-gallery"' not in full_line or 'data-construction-finish="light-engineering"' not in full_line or 'Линия изнутри. В деталях.' not in full_line:
                      raise RuntimeError('Titanium Gallery or light construction display is missing')
                  if full_line.count('data-line-leader="') != 28 or 'data-leader-join="' in full_line or 'assets/lines/separatsiya-02/era-separatsiya-02-layout.webp' not in full_line:
                      raise RuntimeError('The 28 complete vector callouts or new transparent source are missing')
                  for callout in ('27-loading', '27-unloading'):
                      if 'data-line-leader="' + callout + '"' not in full_line or 'data-callout="' + callout + '"' not in full_line:
                          raise RuntimeError('Separate forklift callout is missing: ' + callout)
                  if full_line.count('role="tooltip"') != 1 or 'data-tip-description' not in full_line:
                      raise RuntimeError('The shared callout tooltip is missing')
                  controller_path = re.search(r'src="([^"]*/line-monitor\.js\?v=[^"]+)"', full_line).group(1)
                  _, controller = fetch(controller_path)
                  if 'data-callout-hit' not in controller or 'positionTip' not in controller or 'showTip' not in controller:
                      raise RuntimeError('The published callout controller is stale')
                  unit_cards = re.findall(r'<article class="line-unit-card[^>]*>.*?</article>', full_line, re.S)
                  catalogue_slugs = re.findall(r'data-catalogue-image="([^"]+)"', full_line)
                  if len(unit_cards) != 6 or len(catalogue_slugs) != 5 or 'node-card-specs' in ''.join(unit_cards):
                      raise RuntimeError('Compact equipment cards were expanded or lost')
                  _, equipment_catalogue = fetch('catalog/equipment/')
                  for slug in catalogue_slugs:
                      image_path = 'assets/catalogue/equipment/' + slug + '.webp'
                      if image_path not in full_line or image_path not in equipment_catalogue:
                          raise RuntimeError('Equipment image differs from its catalogue: ' + slug)
                      content_type, image = fetch(image_path, binary=True)
                      if content_type != 'image/webp' or image[:4] != b'RIFF' or image[8:12] != b'WEBP':
                          raise RuntimeError('Catalogue equipment image is unavailable: ' + slug)
                  _, lines_catalogue = fetch('catalog/lines/')
                  blue_cover = 'assets/lines/separatsiya-01/catalog-cover.webp'
                  if blue_cover not in lines_catalogue:
                      raise RuntimeError('The approved blue line catalogue cover is missing')
                  for image_path in ('assets/lines/separatsiya-01/hero-titanium.webp', 'assets/lines/separatsiya-01/hero-titanium-768.webp', 'assets/lines/separatsiya-02/era-separatsiya-02-layout.webp', blue_cover):
                      content_type, image = fetch(image_path, binary=True)
                      if content_type != 'image/webp' or image[:4] != b'RIFF' or image[8:12] != b'WEBP':
                          raise RuntimeError('Titanium, construction or approved catalogue WebP is missing: ' + image_path)
                  print('::notice title=Titanium Gallery verified::Titanium hero and responsive WebP, light 01-27 construction display, six compact equipment cards and five unchanged catalogue images are published. Line and both catalogue routes return HTTP 200.')
                  line_documents = json.loads(re.search(r'<script type="application/json" id="line-document-data">(.*?)</script>', full_line, re.S).group(1))
                  if {d['id'] for d in line_documents} != {'separatsiya-02-technical', 'separatsiya-02-dimensions-a0'}:
                      raise RuntimeError('Separation 02 must show its two actual documents')
                  drawing = by_id['separatsiya-02-dimensions-a0']
                  if drawing['objectSlug'] != 'separatsiya-02' or drawing['category'] != 'drawings' or drawing.get('format') != 'A0' or drawing['pages'] != 1 or drawing['sha256'] != '8557bce36e8963146ec9fd33d11295c4483e2e4d4106f19ae41e7c50c39f98d0':
                      raise RuntimeError('Original A0 record is incorrect')
                  _, drawing_category = fetch('documents/drawings/')
                  if 'data-library-document="separatsiya-02-dimensions-a0"' not in drawing_category or 'PDF · A0 · 1 лист · 2,2 МБ' not in drawing_category:
                      raise RuntimeError('The A0 drawing is not published in its category')
                  for view in ('top', 'side-1', 'side-2', 'sheet'):
                      if 'data-dimension-tab="' + view + '"' not in full_line:
                          raise RuntimeError('A0 projection tab is missing: ' + view)
                      content_type, preview = fetch('assets/lines/separatsiya-02/dimensions/' + view + '.webp', binary=True)
                      if content_type != 'image/webp' or preview[:4] != b'RIFF' or preview[8:12] != b'WEBP':
                          raise RuntimeError('A0 projection image is missing: ' + view)
                  for document in documents:
                      content_type, cover = fetch('assets/' + document['cover'], binary=True)
                      if content_type != 'image/webp' or cover[:4] != b'RIFF' or cover[8:12] != b'WEBP':
                          raise RuntimeError('PDF cover is missing: ' + document['id'])
                  checked_pdfs = ('ballisticheskiy-separator-brochure', 'separatsiya-01-mini-technical', 'separatsiya-02-overview', 'separatsiya-02-technical', 'separatsiya-02-dimensions-a0')
                  for document_id in checked_pdfs:
                      document = by_id[document_id]
                      content_type, pdf = fetch('documents/' + document['file'], binary=True)
                      if content_type != 'application/pdf' or not pdf.startswith(b'%PDF-') or len(pdf) != document['bytes'] or hashlib.sha256(pdf).hexdigest() != document['sha256']:
                          raise RuntimeError('Original PDF HTTP/SHA verification failed: ' + document_id)
                  print(f'::notice title=Engineering library verified::{len(documents)} original PDFs indexed, five category routes, all first-page covers and {len(checked_pdfs)} PDF downloads verified over HTTP.')
                  print('::notice title=Separation 02 A0 verified::Updated line, drawings category, engineering library and original A0 return HTTP 200. A0 Content-Type, PDF header, 2239107 bytes and SHA-256 8557bce36e8963146ec9fd33d11295c4483e2e4d4106f19ae41e7c50c39f98d0 verified. Four projection images are published.')
                  assets = ('gallery-showroom.js', 'gallery-viewer.js', 'gallery-model.js', 'gallery-showroom.css', 'quick-contact.js', 'quick-contact.css', 'about-us.css', 'contact-premium.css', 'assets/brands/telegram.svg', 'assets/brands/max.svg', 'assets/brands/whatsapp.svg', 'video-channels.css', 'navigation.css', 'navigation.js', 'footer.css', 'document-library.js', 'document-library-model.js', 'document-library.css', 'pdf-viewer.js', 'pdf-viewer.css', 'vendor/pdfjs/pdf.mjs', 'vendor/pdfjs/pdf.worker.mjs', 'vendor/fflate.js', 'context-navigation.css', 'context-navigation.js', 'context-history.js', 'interactions.js', 'line-monitor.js', 'line-documents.js', 'line-monitor.css', 'diagram.js')
                  for file in assets:
                      content_type, source = fetch(f'{file}?v={version}')
                      if not source.strip() or 'text/html' in content_type:
                          raise RuntimeError(f'{file}: expected a published asset')
                      if file.endswith(('.js', '.mjs')) and 'javascript' not in content_type:
                          raise RuntimeError(f'{file}: expected JavaScript MIME type')
                      if file.endswith('.svg') and (content_type != 'image/svg+xml' or '<svg' not in source):
                          raise RuntimeError(f'{file}: expected the brand SVG')
                  print(f'::notice title=Public site verified::Home, about us, contacts, gallery and {len(assets)} assets return HTTP 200. Preview mode is off. {base}')
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a') as report:
                          report.write(f'Public HTTP checks passed: [home]({base}), [about us]({base}about-us/), [contacts]({base}contacts/), [gallery]({base}media/) and twenty-seven assets. Preview mode is off.\n')
                  break
              except Exception as error:
                  print(f'Public site check {attempt + 1}/6: {error}', flush=True)
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
      - name: Read the public browser checks
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test/line-diagram-public.mjs
            test/economics-public.mjs
            test/about-us-public.mjs
            test/technology-final-public.mjs
            test/contacts-public.mjs
            test/catalog-public.mjs
            test/hot-wash-public.mjs
            docs/moyka-plenki-assets.json
            test/fixtures/catalog-preserved.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify both public line diagrams in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node test/line-diagram-public.mjs
      - name: Verify published economics in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node test/economics-public.mjs
      - name: Verify published company page in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          ERA_VERIFY_FACTORY_TOUR: '1'
        run: node test/about-us-public.mjs
      - name: Verify published technology in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node test/technology-final-public.mjs
      - name: Verify published contacts in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          ERA_VERIFY_MAP_PROVIDERS: '1'
        run: node test/contacts-public.mjs
      - name: Verify published catalogue in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node test/catalog-public.mjs
      - name: Verify published hot-wash line in Chrome
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node test/hot-wash-public.mjs
