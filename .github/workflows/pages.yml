name: Test and deploy ERA preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_MODE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test root deployment
        run: npm test
      - name: Test project deployment
        run: npm test
        env:
          BASE_PATH: /Website_ERA
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build preview
        run: npm run build
        env:
          BASE_PATH: /Website_ERA
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site
        env:
          ERA_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, re, time, urllib.request
          from urllib.parse import urljoin

          base = os.environ['ERA_SITE_URL'].rstrip('/') + '/'

          def fetch(path):
              url = urljoin(base, path)
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  return response.headers.get_content_type(), response.read(2_000_000).decode('utf-8')

          for attempt in range(6):
              try:
                  markers = {'': 'data-resource-home', 'media/': 'data-gallery-showroom', 'about-us/': 'class="about-us-page"', 'contacts/': 'class="contact-premium-page"'}
                  for path, marker in markers.items():
                      content_type, page = fetch(path)
                      if content_type != 'text/html' or '<html lang="ru">' not in page:
                          raise RuntimeError(f'{urljoin(base, path)}: expected the ERA page')
                      if marker not in page or 'id="quick-contact"' not in page:
                          raise RuntimeError(f'{urljoin(base, path)}: the published update is missing')
                      if '/preview-only.js?' in page:
                          raise RuntimeError(f'{urljoin(base, path)}: preview mode must not be published')
                      if path == 'media/':
                          if 'data-gallery-showroom' not in page or 'id="gallery-data"' not in page:
                              raise RuntimeError('The gallery update is missing')
                          release = re.search(r'gallery-showroom\.js\?v=([^"&]+)', page)
                          if not release:
                              raise RuntimeError('The gallery script is missing')
                          version = release.group(1)
                  for file in ('gallery-showroom.js', 'gallery-viewer.js', 'gallery-model.js', 'gallery-showroom.css', 'quick-contact.js', 'quick-contact.css', 'about-us.css', 'contact-premium.css'):
                      content_type, source = fetch(f'{file}?v={version}')
                      if not source.strip() or 'text/html' in content_type:
                          raise RuntimeError(f'{file}: expected a stylesheet or JavaScript')
                  print(f'::notice title=Public site verified::Home, about us, contacts, gallery and eight assets return HTTP 200. Preview mode is off. {base}')
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a') as report:
                          report.write(f'Public HTTP checks passed: [home]({base}), [about us]({base}about-us/), [contacts]({base}contacts/), [gallery]({base}media/) and eight assets. Preview mode is off.\n')
                  break
              except Exception as error:
                  print(f'Public site check {attempt + 1}/6: {error}', flush=True)
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
