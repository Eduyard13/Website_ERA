name: Verify contact map availability
on:
  push:
    branches: [contacts-source-check-20261117]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/contact-map-sources.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect maps in Chrome without screenshots
        run: |
          mkdir -p sources
          node .github/contact-map-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: era-contact-map-sources
          path: sources
          retention-days: 3
